name: deploy main preview

# The Worker `bradley-portfolio-main-preview` (bradleyberkman.com, www, and
# insights.braininavat.dance) is production, not a preview. ci calls this
# after its check passes on main, whether pushed or dispatched. It deploys
# the exact `dist/` artifact ci built and tested in that same run.
#
# A dispatch redeploys main without a rebuild: it looks up the newest
# unexpired `portfolio-main-preview-<sha>` artifact for main's current commit
# and downloads it. ci only uploads that artifact after `npm test` (which
# ends in `test:rendered`, proving the sentinel keys stay out of the client
# bundle) succeeds, so the artifact's existence is itself the proof the bytes
# were tested — unlike the run's own conclusion, which a later failed deploy
# or live check would also turn red. Rebuilding here instead would risk
# shipping bytes ci never actually tested (dependency drift, a different
# runner image), so downloading is the simplest option that keeps the "deploy
# only what was tested" guarantee without a hand-typed run ID or digest.

on:
  workflow_call:
    inputs:
      tested_run_id:
        type: string
        required: true
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  deploy_main_preview:
    if: github.ref == 'refs/heads/main' && vars.PORTFOLIO_MAIN_PREVIEW_CUSTOM_DOMAIN_DEPLOY_ENABLED == 'true'
    environment: portfolio-main-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-main-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci

      # A standalone redeploy needs to find a tested run; ci passes its own
      # run ID. The artifact's existence is the proof ci tested it, so look
      # that up directly instead
      # of the run's conclusion, which a later failed deploy or live check
      # would also mark failed even though the build and tests passed.
      - name: Find the latest tested artifact for main's current SHA
        id: resolve
        if: inputs.tested_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          RUN_ID="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=portfolio-main-preview-$SHA&per_page=100" --paginate \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .workflow_run.id // empty')"
          if [[ -z "$RUN_ID" ]]; then
            printf 'No unexpired tested artifact found for %s.\n' "$SHA" >&2
            exit 1
          fi
          printf 'Deploying artifact from ci run %s (sha %s).\n' "$RUN_ID" "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download tested main-preview artifact (redeploy)
        if: inputs.tested_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: portfolio-main-preview-${{ steps.resolve.outputs.sha }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.run_id }}
      - name: Download tested main-preview artifact (this run)
        if: inputs.tested_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: portfolio-main-preview-${{ github.sha }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.tested_run_id }}
      - name: Record deployed artifact digest
        run: find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256

      - name: Install the error-probe secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERROR_INTAKE_SECRET: ${{ secrets.ERROR_INTAKE_SECRET }}
        run: printf '%s' "$ERROR_INTAKE_SECRET" | npx wrangler secret put ERROR_INTAKE_SECRET --config wrangler.main-preview.jsonc

      - name: Deploy tested main-preview artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.main-preview.jsonc --strict --message "main ${{ steps.resolve.outputs.sha || github.sha }}"
      - name: Install the live check's browser
        run: npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Live check against production
        run: npm run live -- --dist dist
