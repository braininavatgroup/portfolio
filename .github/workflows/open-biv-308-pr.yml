name: open-biv-308-pr

on:
  push:
    branches:
      - biv-308-add-dormant-launch-controls-and-offline-evals-for-portfolio

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open the BIV-308 pull request as GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq length)" -gt 0 ]; then
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "BIV-308: add dormant portfolio chat launch controls" \
            --body-file - <<'EOF'
          Linear: https://linear.app/bradleys-workspace/issue/BIV-308/add-dormant-launch-controls-and-offline-evals-for-portfolio-chat

          Adds false-by-default preview controls, bounded grounded streaming, privacy-safe telemetry, exact budget enforcement, and deterministic offline evaluation.

          No deployment, secret provisioning, provider spend, or activation is included.
          EOF
