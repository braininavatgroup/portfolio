name: verify scheduled insights

on:
  schedule:
    # The Worker runs at 11:10 UTC. Read its saved page after it has finished.
    - cron: '40 11 * * *'
  workflow_dispatch:
    inputs:
      expected_action_ids:
        description: 'Comma-separated preserved Action UUIDs for a private source check'
        required: false
        type: string
      retire_legacy_credential:
        description: 'After private source proof, delete only the obsolete Worker Airtable secret'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: portfolio-main-preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Check the scheduled dashboard saved in R2
        run: node scripts/verify-scheduled-insights.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ACTION_IDS: ${{ inputs.expected_action_ids }}
          RETIRE_LEGACY_CREDENTIAL: ${{ inputs.retire_legacy_credential }}
      - name: Retire obsolete Worker Airtable credential
        if: ${{ inputs.retire_legacy_credential }}
        run: |
          test -n "$EXPECTED_ACTION_IDS"
          npx wrangler secret delete PORTFOLIO_INSIGHTS_AIRTABLE_TOKEN --config wrangler.main-preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ACTION_IDS: ${{ inputs.expected_action_ids }}
