name: ci

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      # npm test ends with test:rendered, whose build is the dist the deploy
      # job ships. The Turnstile site key is public and compiled into the
      # client bundle, so it has to be present at build time.
      - run: npm test
        env:
          VITE_PORTFOLIO_CHAT_TURNSTILE_SITE_KEY: ${{ vars.PORTFOLIO_CHAT_TURNSTILE_SITE_KEY }}
      - name: Upload tested main-preview artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-main-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Portfolio is a single app, so every push to main that passes ci is a
  # candidate deploy; deploy-main-preview.yml owns the
  # PORTFOLIO_MAIN_PREVIEW_CUSTOM_DOMAIN_DEPLOY_ENABLED and
  # portfolio-main-preview environment gates, and deploys the exact artifact
  # ci just built and tested in this run.
  deploy_main_preview:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-main-preview.yml
    secrets: inherit
