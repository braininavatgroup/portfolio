name: ci

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Public-tree denylist
        uses: braininavatgroup/agent-operating-policy/.github/actions/public-tree-check@b8c552c8c595504eb3090042422b0e617c4c726b
        with:
          denylist: ${{ vars.PUBLIC_TREE_DENYLIST }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      # npm test ends with test:rendered, whose build is the dist the deploy
      # job ships. The Turnstile site key is public and compiled into the
      # client bundle, so it has to be present at build time.
      - run: npm test
        env:
          VITE_PORTFOLIO_CHAT_TURNSTILE_SITE_KEY: ${{ vars.PORTFOLIO_CHAT_TURNSTILE_SITE_KEY }}
      - name: Upload tested main-preview artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-main-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

# Portfolio is a single app, so every checked main run is a
  # candidate deploy; deploy-main-preview.yml owns the
  # PORTFOLIO_MAIN_PREVIEW_CUSTOM_DOMAIN_DEPLOY_ENABLED and
  # portfolio-main-preview environment gates, and deploys the exact artifact
  # ci just built and tested in this run.
  deploy_main_preview:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-main-preview.yml
    with:
      tested_run_id: ${{ format('{0}', github.run_id) }}
    secrets: inherit
