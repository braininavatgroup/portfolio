name: ci

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Public-tree denylist
        uses: braininavatgroup/portfolio/.github/actions/public-tree-check@587f84391e665ceaf869d20c925e542d49ae5ef7
        with:
          denylist: ${{ vars.PUBLIC_TREE_DENYLIST }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Exercise the deployed browser install before native verification
        run: npx --yes playwright@1.64.1 install --with-deps chromium
      # npm test ends with test:rendered, whose build is the dist the deploy
      # job ships. The Turnstile site key is public and compiled into the
      # client bundle, so it has to be present at build time.
      - run: npm test
        env:
          VITE_PORTFOLIO_CHAT_TURNSTILE_SITE_KEY: ${{ vars.PORTFOLIO_CHAT_TURNSTILE_SITE_KEY }}
      - name: Upload tested main-preview artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-main-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

# Portfolio is a single app, so every checked main run is a
  # candidate deploy; deploy-main-preview.yml owns the
  # PORTFOLIO_MAIN_PREVIEW_CUSTOM_DOMAIN_DEPLOY_ENABLED and
  # portfolio-main-preview environment gates, and deploys the exact artifact
  # ci just built and tested in this run.
  deploy_main_preview:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-main-preview.yml
    with:
      tested_run_id: ${{ format('{0}', github.run_id) }}
    secrets: inherit
