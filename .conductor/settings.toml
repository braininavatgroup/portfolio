"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# BIV-348: without an archive hook, archived workspaces kept 20 GB of dead
# node_modules. Agents create no nested worktrees, so the hook only removes those.

[git]
archive_on_merge = true
delete_branch_on_archive = true

[scripts]
setup = "bash scripts/bootstrap-worktree.sh"
run_mode = "concurrent"
archive = "rm -rf node_modules"

[scripts.run.dev]
available_in = [ "local" ]
command = "npm run dev -- --host 127.0.0.1 --port $CONDUCTOR_PORT --strictPort"
default = true
icon = "play"

[scripts.run.test]
command = "npm test"
icon = "test-tube"
