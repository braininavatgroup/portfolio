<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Bradley Berkman</title>
  <style>
    @font-face {
      font-family: "NHG control";
      src: url("https://braininavat.systems/assets/brand-review/fonts/NeueHaasDisplayRoman.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "NHG control";
      src: url("https://braininavat.systems/assets/brand-review/fonts/NeueHaasDisplayMediu.ttf") format("truetype");
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --ink: #201711;
      --muted: #62676b;
      --paper: #c5cbd0;
      --reader: #eff1f1;
      --reader-summary: #413a35;
      --reader-body: #514a45;
      --reader-muted: #6b6d6d;
      --line: rgba(32, 23, 17, 0.18);
      --line-strong: rgba(32, 23, 17, 0.38);
      --story: #466700;
      --story-ink: #eff1f1;
      --finding-story: #d7191c;
      --kicker: #5d6d88;
      --chemical: #ded676;
      --chemical-ink: #201711;
      --world-fill: rgba(197, 203, 208, 0.9);
      --assistant-surface: #fbfbfa;
      --reader-width: clamp(460px, 38vw, 560px);
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --ink: #f0e6dc;
      --muted: #a69c92;
      --paper: #19140f;
      --reader: #292625;
      --reader-summary: #ded4cb;
      --reader-body: #c1b7ae;
      --reader-muted: #aaa098;
      --line: rgba(240, 230, 220, 0.17);
      --line-strong: rgba(240, 230, 220, 0.34);
      --story: #b6df5b;
      --story-ink: #19140f;
      --finding-story: #ff554a;
      --kicker: #9ba9c2;
      --chemical: #ded676;
      --chemical-ink: #201711;
      --world-fill: rgba(25, 20, 15, 0.9);
      --assistant-surface: #1c1916;
    }

    * { box-sizing: border-box; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "NHG control", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-synthesis: none;
      font-kerning: normal;
      text-rendering: optimizeLegibility;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    @media (pointer: fine) {
      html,
      body,
      body * { cursor: none !important; }
    }

    #world {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
      touch-action: none;
    }

    #world.can-drag { cursor: none; }
    #world.dragging,
    #world.over-node { cursor: none; }

    .mast {
      position: fixed;
      z-index: 4;
      top: 20px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    .mast-name {
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .mode-switch {
      position: fixed;
      z-index: 7;
      top: 15px;
      left: calc((100vw - var(--reader-width)) / 2);
      transform: translateX(-50%);
      display: none;
      padding: 3px;
      border: 1px solid rgba(23, 23, 20, 0.2);
      border-radius: 999px;
      background: rgba(248, 247, 242, 0.82);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 30px rgba(35, 32, 25, 0.07);
    }

    .mode-switch button {
      min-width: 92px;
      padding: 8px 15px 9px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .mode-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    #reader {
      position: fixed;
      z-index: 6;
      top: 0;
      right: 0;
      width: var(--reader-width);
      min-width: 0;
      height: 100%;
      overflow: auto;
      background: var(--reader);
      border-left: 1px solid var(--line);
    }

    .reader-top {
      position: sticky;
      z-index: 2;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--reader);
    }

    #reader[data-mode="index"] .reader-top { display: none; }

    .reader-nav {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .index-button {
      border: 0;
      padding: 0;
      color: var(--ink);
      background: none;
      font-weight: 500;
      letter-spacing: -0.02em;
      cursor: pointer;
    }

    .system-button {
      border: 0;
      padding: 0;
      color: var(--reader-muted);
      background: none;
      font-size: 11px;
      font-weight: 400;
      cursor: pointer;
    }

    #readerContent {
      padding: 16px 24px 48px;
    }

    .reader-intro {
      max-width: 29ch;
      margin: 10px 0 38px;
      font-size: clamp(25px, 2.5vw, 37px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 500;
    }

    .index-group,
    .index-stories,
    .connection-key { margin: 0 0 31px; }

    .index-group h2,
    .index-stories h2,
    .connection-key h2 {
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    .index-row,
    .index-story {
      position: relative;
      display: block;
      width: 100%;
      padding: 10px 24px 12px 0;
      border: 0;
      border-top: 1px solid var(--line);
      color: var(--ink);
      background: none;
      text-align: left;
      cursor: pointer;
    }

    .index-row:last-child,
    .index-story:last-child { border-bottom: 1px solid var(--line); }

    .index-story::before {
      position: absolute;
      top: 14px;
      left: 0;
      width: 7px;
      height: 7px;
      border: 1px solid var(--story-ink);
      border-radius: 50%;
      background: var(--story-color, var(--story));
      content: "";
    }

    .index-story[data-story="finding-myself-in-software"] {
      --story-color: var(--finding-story);
    }

    .index-story { padding-left: 17px; }

    .index-row-title {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 15px;
      line-height: 1.2;
    }

    .index-row-title span:last-child {
      color: var(--reader-muted);
      transition: transform 150ms ease;
    }

    .index-row:hover .index-row-title span:last-child { transform: translateX(4px); }

    .index-row p {
      max-width: 34ch;
      margin: 5px 22px 0 0;
      color: var(--reader-muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .index-story strong {
      display: block;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .index-story p {
      max-width: 34ch;
      margin: 5px 0 0;
      color: var(--reader-muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .index-story::after {
      position: absolute;
      top: 12px;
      right: 1px;
      color: var(--reader-muted);
      content: "↗";
    }

    .connection-key-list {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .connection-key-row {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 12px;
      min-height: 35px;
      color: var(--reader-muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .connection-key-row + .connection-key-row { border-top: 1px solid var(--line); }

    .connection-line {
      display: block;
      width: 36px;
      height: 1px;
      background: var(--ink);
      opacity: 0.7;
    }

    .connection-line--lineage {
      background: repeating-linear-gradient(90deg, var(--ink) 0 7px, transparent 7px 13px);
    }

    .record-kind {
      margin: 12px 0 17px;
      color: var(--kicker);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.025em;
    }

    .record-title {
      max-width: 8.5em;
      margin: 0 0 22px;
      font-size: clamp(34px, 4vw, 53px);
      line-height: 0.92;
      letter-spacing: -0.065em;
      font-weight: 400;
    }

    .record-summary {
      max-width: 31ch;
      margin: 0 0 42px;
      color: var(--reader-summary);
      font-size: 15px;
      line-height: 1.43;
      letter-spacing: -0.015em;
    }

    .record-section {
      padding: 17px 0 22px;
      border-top: 1px solid var(--line);
    }

    .record-section h3 {
      margin: 0 0 9px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    .record-section p {
      margin: 0;
      color: var(--reader-body);
      font-size: 12px;
      line-height: 1.48;
    }

    .evidence-list { list-style: none; margin: 0; padding: 0; }

    .evidence-list li {
      display: grid;
      grid-template-columns: 9px 1fr;
      gap: 10px;
      align-items: start;
      padding: 8px 0;
      color: var(--reader-body);
      font-size: 12px;
      line-height: 1.35;
    }

    .system-intro {
      max-width: 29ch;
      margin: 10px 0 31px;
      color: var(--reader-summary);
      font-size: 19px;
      line-height: 1.18;
      letter-spacing: -0.025em;
    }

    .system-group {
      padding: 17px 0 22px;
      border-top: 1px solid var(--line);
    }

    .system-group h2 {
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
    }

    .system-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .system-list li {
      display: grid;
      grid-template-columns: 51px 1fr;
      gap: 9px;
      padding: 7px 0;
      color: var(--reader-body);
      font-size: 11px;
      line-height: 1.42;
    }

    .system-list strong {
      color: var(--reader-muted);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .palette-row {
      display: grid;
      grid-template-columns: 17px 1fr auto;
      gap: 9px;
      align-items: center;
      padding: 6px 0;
      color: var(--reader-body);
      font-size: 11px;
    }

    .swatch {
      width: 17px;
      height: 17px;
      border: 1px solid var(--line);
      background: var(--swatch);
    }

    .palette-row code {
      color: var(--reader-muted);
      font: inherit;
      font-size: 9px;
    }

    .evidence-list i {
      width: 7px;
      height: 7px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--story);
    }

    .reader-path {
      margin: 12px 0 18px;
      color: var(--reader-muted);
      font-size: 9px;
    }

    .reader-path button {
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    .story-kicker {
      display: inline-block;
      padding: 5px 7px 4px;
      color: var(--story-ink);
      background: var(--story);
    }

    .story-kicker[data-story-kicker="finding-myself-in-software"] {
      background: var(--finding-story);
    }

    .conversation-dock {
      position: fixed;
      z-index: 8;
      right: calc(var(--reader-width) + 18px);
      bottom: 16px;
      display: flex;
      align-items: flex-end;
      pointer-events: none;
    }

    .mini-avatar {
      position: relative;
      z-index: 2;
      flex: 0 0 70px;
      width: 70px;
      height: 88px;
      margin-right: -7px;
      pointer-events: none;
    }

    .mini-avatar svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .avatar-body { fill: var(--ink); opacity: 0.92; }
    .avatar-glass { fill: var(--world-fill); stroke: var(--ink); stroke-width: 1.2; }
    .avatar-brain { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-width: 2.4; }
    .avatar-head { transform-box: fill-box; transform-origin: center bottom; transition: transform 180ms ease; }
    .conversation-dock.thinking .avatar-head { transform: rotate(-7deg) translateY(-2px); }

    .assistant-anchor {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 9px;
      pointer-events: auto;
    }

    .assistant-panel {
      width: 18rem;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 15px;
      background: var(--assistant-surface);
      box-shadow: 0 18px 48px rgba(32, 23, 17, 0.2);
    }

    body[data-assistant="closed"] .assistant-panel { display: none; }

    .assistant-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      touch-action: none;
      user-select: none;
    }

    .assistant-head b { font-size: 10px; font-weight: 600; }

    .assistant-head button {
      padding: 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
    }

    .assistant-thread {
      max-height: 270px;
      padding: 11px;
      overflow-y: auto;
    }

    .question { display: flex; justify-content: flex-end; }

    .question p {
      max-width: 88%;
      margin: 0;
      padding: 7px 8px;
      border-radius: 12px 12px 3px 12px;
      background: color-mix(in srgb, var(--ink) 8%, transparent);
      font-size: 10px;
      line-height: 1.4;
    }

    .answer {
      margin: 11px 0 0;
      font-size: 11px;
      line-height: 1.48;
    }

    .answer strong { font-weight: 600; }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 9px;
    }

    .sources span {
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 8px;
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 5px;
      margin: 0 8px 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .composer input {
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: 9px;
    }

    .composer button {
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      color: var(--assistant-surface);
      background: var(--ink);
    }

    .trigger-row { display: flex; align-items: center; }

    .assistant-trigger {
      display: flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--ink);
      background: color-mix(in srgb, var(--reader) 92%, transparent);
      box-shadow: 0 10px 25px rgba(23, 23, 23, 0.14);
    }

    .chat-glyph {
      position: relative;
      width: 16px;
      height: 12px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
    }

    .chat-glyph::after {
      position: absolute;
      bottom: -4px;
      left: 3px;
      width: 5px;
      height: 5px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      background: var(--reader);
      content: "";
      rotate: 45deg;
    }

    body[data-assistant="open"] .trigger-row { display: none; }

    #reticle {
      position: fixed;
      z-index: 3;
      display: none;
      width: 18px;
      height: 18px;
      border: 1px solid var(--line);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    body.roam #reticle { display: block; }

    #cursorInstrument {
      position: fixed;
      z-index: 12;
      top: 0;
      left: 0;
      width: 34px;
      height: 34px;
      opacity: 0;
      transform: translate(-17px, -17px);
      pointer-events: none;
      transition: opacity 90ms ease;
    }

    body.cursor-on #cursorInstrument,
    body.cursor-node #cursorInstrument,
    body.cursor-held #cursorInstrument { opacity: 1; }

    .cursor-arm {
      position: absolute;
      background: var(--cursor-a);
      transition-property: none;
    }

    .cursor-arm.n,
    .cursor-arm.s {
      left: 16px;
      width: 2px;
      height: 7px;
    }

    .cursor-arm.e,
    .cursor-arm.w {
      top: 16px;
      width: 7px;
      height: 2px;
    }

    .cursor-arm.n { top: 1px; transform: translateY(7px); }
    .cursor-arm.s { bottom: 1px; transform: translateY(-7px); }
    .cursor-arm.w { left: 1px; transform: translateX(7px); }
    .cursor-arm.e { right: 1px; transform: translateX(-7px); }

    .cursor-pin {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--cursor-b);
      transition-property: none;
    }

    body.cursor-action:not(.cursor-held) .cursor-arm,
    body.cursor-node:not(.cursor-held) .cursor-arm { background: var(--cursor-b); }
    body.cursor-action:not(.cursor-held) .cursor-pin,
    body.cursor-node:not(.cursor-held) .cursor-pin { background: var(--cursor-a); }
    body.cursor-held .cursor-arm { background: var(--cursor-a); }
    body.cursor-held .cursor-pin { background: var(--cursor-b); }

    @media (max-width: 900px) {
      :root { --reader-width: 100%; }
      #world,
      .mast,
      .mode-switch,
      #reticle { display: none; }
      #reader { width: 100%; min-width: 0; border-left: 0; }
      .conversation-dock {
        right: auto;
        bottom: 14px;
        left: 14px;
      }
      .assistant-panel { width: min(18rem, calc(100vw - 84px)); }
      .assistant-thread { max-height: min(52vh, 360px); }
      body[data-assistant="open"] #reader { display: none; }
    }

    @media (pointer: coarse) {
      #cursorInstrument { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      #cursorInstrument { transition-duration: 1ms; }
    }
  </style>
</head>
<body data-assistant="closed">
  <canvas id="world" aria-label="Spatial portfolio world"></canvas>

  <div class="mast">
    <span class="mast-name">Bradley Berkman</span>
  </div>

  <div class="mode-switch" aria-label="Movement model">
    <button id="composedButton" aria-pressed="true">Composed</button>
    <button id="roamButton" aria-pressed="false">Roam</button>
  </div>

  <div id="reticle"></div>
  <div id="cursorInstrument" aria-hidden="true" style="--cursor-a: #201711; --cursor-b: #dfe8ee">
    <i class="cursor-arm n"></i>
    <i class="cursor-arm e"></i>
    <i class="cursor-arm s"></i>
    <i class="cursor-arm w"></i>
    <i class="cursor-pin"></i>
  </div>

  <aside id="reader">
    <div class="reader-top">
      <div class="reader-nav">
        <button class="index-button" id="indexButton">← Index</button>
      </div>
    </div>
    <div id="readerContent"></div>
  </aside>

  <div class="conversation-dock" id="conversationDock">
    <div aria-hidden="true" class="mini-avatar">
      <svg viewBox="0 0 70 88">
        <path class="avatar-body" d="M31 38h10l7 19-6 4-3-10v15l8 18h-8l-5-13-4 13h-8l7-18V51l-4 10-6-4 7-19h5z"></path>
        <g class="avatar-head">
          <circle class="avatar-glass" cx="36" cy="25" r="15"></circle>
          <path class="avatar-brain" d="M28 26c-2-5 2-10 6-7 2-5 8-2 7 2 5-1 6 6 2 8 1 5-6 7-9 3-4 3-8-2-6-6z"></path>
        </g>
      </svg>
    </div>
    <div class="assistant-anchor">
      <section aria-label="Portfolio assistant" class="assistant-panel" id="assistant-panel">
        <header class="assistant-head" id="assistant-drag-handle">
          <b>Ask the portfolio</b>
          <button aria-label="Minimize assistant" id="assistant-close" type="button">×</button>
        </header>
        <div aria-live="polite" class="assistant-thread">
          <div class="question"><p>Where does human judgment matter?</p></div>
          <p class="answer">The strongest pattern is in <strong>pitching and reporting</strong>. Automation prepares the evidence, but final selection and interpretation stay human.</p>
          <div class="sources"><span>E1 · Pitching</span><span>E2 · Reporting</span></div>
        </div>
        <form class="composer" id="assistant-composer">
          <label class="sr-only" for="portfolio-question-prototype">Ask a follow-up</label>
          <input id="portfolio-question-prototype" placeholder="Ask a follow-up" type="text">
          <button aria-label="Send" type="submit">↑</button>
        </form>
      </section>
      <div class="trigger-row">
        <button aria-expanded="false" aria-label="Open portfolio assistant" class="assistant-trigger" id="assistant-trigger" type="button">
          <span aria-hidden="true" class="chat-glyph"></span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const reader = document.getElementById('reader');
    const readerContent = document.getElementById('readerContent');
    const reticle = document.getElementById('reticle');
    const cursorInstrument = document.getElementById('cursorInstrument');

      return `#${(0xffffff ^ value).toString(16).padStart(6, '0')}`;

      node.rawBase = { x: node.x, y: node.y, z: node.z };
      node.base = { x: node.x, y: node.y, z: node.z };
      node.goal = { x: node.x, y: node.y, z: node.z };
      node.screen = null;
      node.alpha = 1;
      node.goalAlpha = 1;
      node.returning = false;
      node.userPlaced = false;
    });

    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let mode = 'composed';
    let selected = null;
    let activeStoryId = null;
    let indexScrollTop = 0;
    let hovered = null;
    let pointer = { x: 0, y: 0 };
    let dragging = false;
    let dragDistance = 0;
    let dragKind = null;
    let dragNode = null;
    let downNode = null;
    let lastPointer = { x: 0, y: 0 };
    let labelLayoutDirty = true;
    let labelLayoutStableFrames = 0;
    const keys = new Set();

    const overview = {
      position: { x: 0, y: 35, z: -760 },
      target: { x: 0, y: 0, z: 760 }
    };

    const camera = {
      position: { ...overview.position },
      target: { ...overview.target },
      goalPosition: { ...overview.position },
      goalTarget: { ...overview.target },
      yaw: 0,
      pitch: 0,
      fov: 720
    };

    function resize() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      const worldWidth = width - reader.getBoundingClientRect().width;
      camera.fov = Math.max(180, Math.min(720, (worldWidth - 75) * 0.74, height * 0.9));
      reticle.style.left = worldWidth / 2 + 'px';
      reticle.style.top = height / 2 + 'px';
      fitOverviewLayout();
      if (activeStoryId) fitStoryLayout(storyById[activeStoryId]);
      markLabelLayoutDirty();
    }

    function markLabelLayoutDirty() {
      labelLayoutDirty = true;
      labelLayoutStableFrames = 0;
    }

    function normalise(v) {
      const length = Math.hypot(v.x, v.y, v.z) || 1;
      return { x: v.x / length, y: v.y / length, z: v.z / length };
    }

    function cross(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }

    function basis() {
      const forward = normalise({
        x: camera.target.x - camera.position.x,
        y: camera.target.y - camera.position.y,
        z: camera.target.z - camera.position.z
      });
      const right = normalise(cross(forward, { x: 0, y: 1, z: 0 }));
      const up = normalise(cross(right, forward));
      return { forward, right, up };
    }

    function project(point) {
      const b = basis();
      const delta = {
        x: point.x - camera.position.x,
        y: point.y - camera.position.y,
        z: point.z - camera.position.z
      };
      const depth = dot(delta, b.forward);
      if (depth < 30) return null;
      const worldWidth = width - reader.getBoundingClientRect().width;
      const scale = camera.fov / depth;
      return {
        x: worldWidth / 2 + dot(delta, b.right) * scale,
        y: height / 2 - dot(delta, b.up) * scale,
        depth,
        scale
      };
    }

    function projectOverviewPoint(point) {
      const forward = normalise({
        x: overview.target.x - overview.position.x,
        y: overview.target.y - overview.position.y,
        z: overview.target.z - overview.position.z
      });
      const right = normalise(cross(forward, { x: 0, y: 1, z: 0 }));
      const up = normalise(cross(right, forward));
      const delta = {
        x: point.x - overview.position.x,
        y: point.y - overview.position.y,
        z: point.z - overview.position.z
      };
      const depth = dot(delta, forward);
      const worldWidth = width - reader.getBoundingClientRect().width;
      const scale = camera.fov / depth;
      return {
        x: worldWidth / 2 + dot(delta, right) * scale,
        y: height / 2 - dot(delta, up) * scale,
        depth,
        scale,
        right,
        up
      };
    }

    function fitOverviewLayout() {
      if (!width || !height || !nodes.every(node => node.rawBase)) return;
      const worldWidth = width - reader.getBoundingClientRect().width;
      const working = Object.fromEntries(nodes.map(node => [node.id, { ...node.rawBase }]));
      const isPinned = id => id === 'bradley' || byId[id].form === 'story' || byId[id].userPlaced;

      ctx.save();
      ctx.font = '400 12.5px "NHG control", "Helvetica Neue", Helvetica, Arial, sans-serif';

      const projectWorking = () => Object.fromEntries(nodes.map(node => {
        const screen = projectOverviewPoint(working[node.id]);
        const lines = wrapLabelLines(node.label);
        const labelWidth = Math.ceil(Math.max(...lines.map(line => ctx.measureText(line).width)));
        const halfWidth = Math.max(13, labelWidth / 2);
        return [node.id, {
          ...screen,
          footprint: {
            x: screen.x - halfWidth,
            y: screen.y - 13,
            width: halfWidth * 2,
            height: 31 + lines.length * 15
          }
        }];
      }));

      const applyPush = (id, dx, dy, screen) => {
        if (isPinned(id)) return;
        const point = working[id];
        const inverseScale = 1 / Math.max(0.18, screen.scale);
        point.x += screen.right.x * dx * inverseScale - screen.up.x * dy * inverseScale;
        point.y += screen.right.y * dx * inverseScale - screen.up.y * dy * inverseScale;
        point.z += screen.right.z * dx * inverseScale - screen.up.z * dy * inverseScale;
        point.x = Math.max(-940, Math.min(940, point.x));
        point.y = Math.max(-540, Math.min(540, point.y));
        point.z = Math.max(480, Math.min(1120, point.z));
      };

      for (let iteration = 0; iteration < 120; iteration += 1) {
        const projected = projectWorking();
        let moved = false;

        for (let aIndex = 0; aIndex < nodes.length; aIndex += 1) {
          for (let bIndex = aIndex + 1; bIndex < nodes.length; bIndex += 1) {
            const a = projected[nodes[aIndex].id];
            const b = projected[nodes[bIndex].id];
            const overlapX = Math.min(a.footprint.x + a.footprint.width, b.footprint.x + b.footprint.width)
              - Math.max(a.footprint.x, b.footprint.x) + 5;
            const overlapY = Math.min(a.footprint.y + a.footprint.height, b.footprint.y + b.footprint.height)
              - Math.max(a.footprint.y, b.footprint.y) + 5;
            if (overlapX <= 0 || overlapY <= 0) continue;

            moved = true;
            const aId = nodes[aIndex].id;
            const bId = nodes[bIndex].id;
            const aShare = isPinned(aId) ? 0 : isPinned(bId) ? 1 : 0.5;
            const bShare = 1 - aShare;
            if (overlapX < overlapY) {
              const direction = b.x >= a.x ? 1 : -1;
              applyPush(aId, -direction * overlapX * aShare, 0, a);
              applyPush(bId, direction * overlapX * bShare, 0, b);
            } else {
              const direction = b.y >= a.y ? 1 : -1;
              applyPush(aId, 0, -direction * overlapY * aShare, a);
              applyPush(bId, 0, direction * overlapY * bShare, b);
            }
          }
        }

        for (const node of nodes) {
          const screen = projected[node.id];
          const box = screen.footprint;
          if (box.x < 12) { applyPush(node.id, 12 - box.x, 0, screen); moved = true; }
          if (box.x + box.width > worldWidth - 12) { applyPush(node.id, worldWidth - 12 - box.x - box.width, 0, screen); moved = true; }
          if (box.y < 18) { applyPush(node.id, 0, 18 - box.y, screen); moved = true; }
          if (box.y + box.height > height - 78) { applyPush(node.id, 0, height - 78 - box.y - box.height, screen); moved = true; }
        }

        if (!moved) break;
      }

      nodes.forEach(node => {
        node.base = { ...working[node.id] };
        if (!selected && !activeStoryId) {
          node.x = node.base.x;
          node.y = node.base.y;
          node.z = node.base.z;
          node.goal = { ...node.base };
        }
      });
      ctx.restore();
    }

    const storyView = {
      position: { x: -90, y: 55, z: -650 },
      target: { x: 0, y: -10, z: 800 }
    };

    function projectStoryPoint(point) {
      const forward = normalise({
        x: storyView.target.x - storyView.position.x,
        y: storyView.target.y - storyView.position.y,
        z: storyView.target.z - storyView.position.z
      });
      const right = normalise(cross(forward, { x: 0, y: 1, z: 0 }));
      const up = normalise(cross(right, forward));
      const delta = {
        x: point.x - storyView.position.x,
        y: point.y - storyView.position.y,
        z: point.z - storyView.position.z
      };
      const depth = dot(delta, forward);
      const worldWidth = width - reader.getBoundingClientRect().width;
      const scale = camera.fov / depth;
      return {
        x: worldWidth / 2 + dot(delta, right) * scale,
        y: height / 2 - dot(delta, up) * scale,
        depth,
        scale,
        right,
        up
      };
    }

    function fitStoryLayout(story) {
      if (!story || !width || !height) return;
      const ids = ['bradley', story.nodeId, ...story.members];
      const working = Object.fromEntries(ids.map(id => {
        if (id === 'bradley') return [id, { ...story.bradleyPosition }];
        if (id === story.nodeId) return [id, { ...story.nodePosition }];
        return [id, { ...story.positions[id] }];
      }));
      const isPinned = id => id === 'bradley' || id === story.nodeId;
      const worldWidth = width - reader.getBoundingClientRect().width;

      ctx.save();
      ctx.font = '400 12.5px "NHG control", "Helvetica Neue", Helvetica, Arial, sans-serif';

      const projectWorking = () => Object.fromEntries(ids.map(id => {
        const node = byId[id];
        const screen = projectStoryPoint(working[id]);
        const lines = wrapLabelLines(node.label);
        const labelWidth = Math.ceil(Math.max(...lines.map(line => ctx.measureText(line).width)));
        const halfWidth = Math.max(15, labelWidth / 2);
        return [id, {
          ...screen,
          footprint: {
            x: screen.x - halfWidth,
            y: screen.y - 14,
            width: halfWidth * 2,
            height: 34 + lines.length * 15
          }
        }];
      }));

      const applyPush = (id, dx, dy, screen) => {
        if (isPinned(id)) return;
        const point = working[id];
        const inverseScale = 1 / Math.max(0.18, screen.scale);
        point.x += screen.right.x * dx * inverseScale - screen.up.x * dy * inverseScale;
        point.y += screen.right.y * dx * inverseScale - screen.up.y * dy * inverseScale;
        point.z += screen.right.z * dx * inverseScale - screen.up.z * dy * inverseScale;
        point.x = Math.max(-980, Math.min(980, point.x));
        point.y = Math.max(-590, Math.min(590, point.y));
        point.z = Math.max(620, Math.min(1050, point.z));
      };

      for (let iteration = 0; iteration < 160; iteration += 1) {
        const projected = projectWorking();
        let moved = false;

        for (let aIndex = 0; aIndex < ids.length; aIndex += 1) {
          for (let bIndex = aIndex + 1; bIndex < ids.length; bIndex += 1) {
            const aId = ids[aIndex];
            const bId = ids[bIndex];
            const a = projected[aId];
            const b = projected[bId];
            const overlapX = Math.min(a.footprint.x + a.footprint.width, b.footprint.x + b.footprint.width)
              - Math.max(a.footprint.x, b.footprint.x) + 8;
            const overlapY = Math.min(a.footprint.y + a.footprint.height, b.footprint.y + b.footprint.height)
              - Math.max(a.footprint.y, b.footprint.y) + 8;
            if (overlapX <= 0 || overlapY <= 0 || (isPinned(aId) && isPinned(bId))) continue;

            moved = true;
            const aShare = isPinned(aId) ? 0 : isPinned(bId) ? 1 : 0.5;
            const bShare = 1 - aShare;
            if (overlapX < overlapY) {
              const direction = b.x >= a.x ? 1 : -1;
              applyPush(aId, -direction * overlapX * aShare, 0, a);
              applyPush(bId, direction * overlapX * bShare, 0, b);
            } else {
              const direction = b.y >= a.y ? 1 : -1;
              applyPush(aId, 0, -direction * overlapY * aShare, a);
              applyPush(bId, 0, direction * overlapY * bShare, b);
            }
          }
        }

        for (const id of ids) {
          if (isPinned(id)) continue;
          const screen = projected[id];
          const box = screen.footprint;
          if (box.x < 18) { applyPush(id, 18 - box.x, 0, screen); moved = true; }
          if (box.x + box.width > worldWidth - 18) { applyPush(id, worldWidth - 18 - box.x - box.width, 0, screen); moved = true; }
          if (box.y < 18) { applyPush(id, 0, 18 - box.y, screen); moved = true; }
          if (box.y + box.height > height - 84) { applyPush(id, 0, height - 84 - box.y - box.height, screen); moved = true; }
        }

        if (!moved) break;
      }

      ids.forEach(id => { byId[id].goal = { ...working[id] }; });
      ctx.restore();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function stateHash(nodeId, storyId) {
      if (storyId && nodeId) return `story/${storyId}/${nodeId}`;
      if (storyId) return `story/${storyId}`;
      return nodeId || '';
    }

    function pushHistory(nodeId, storyId) {
      history.replaceState({ node: selected, story: activeStoryId, scroll: reader.scrollTop, indexScrollTop }, '', location.href);
      const url = new URL(location.href);
      url.hash = stateHash(nodeId, storyId);
      history.pushState({ node: nodeId, story: storyId, scroll: 0, indexScrollTop }, '', url);
    }

    function applyOverviewGoals() {
      nodes.forEach(node => {
        node.goal = { ...node.base };
        node.goalAlpha = 1;
        node.returning = false;
      });
      if (mode === 'composed') {
        camera.goalPosition = { ...overview.position };
        camera.goalTarget = { ...overview.target };
      }
      markLabelLayoutDirty();
    }

    function setOverview(historyAction = 'push') {
      const hadComposition = Boolean(selected || activeStoryId);
      if (historyAction === 'push' && hadComposition) pushHistory(null, null);
      selected = null;
      activeStoryId = null;
      applyOverviewGoals();
      renderIndex();
      reader.scrollTo({ top: indexScrollTop, behavior: 'auto' });
    }

    function selectStory(story, historyAction = 'push') {
      if (!story) return;
      if (reader.dataset.mode === 'index') indexScrollTop = reader.scrollTop;
      if (historyAction === 'push') pushHistory(null, story.id);
      selected = story.nodeId;
      activeStoryId = story.id;
      nodes.forEach(node => {
        node.returning = false;
        if (node.id === 'bradley') node.goal = { ...story.bradleyPosition };
        else if (node.id === story.nodeId) node.goal = { ...story.nodePosition };
        else node.goal = story.positions[node.id] ? { ...story.positions[node.id] } : { ...node.base };
        node.goalAlpha = node.id === 'bradley' || node.id === story.nodeId || story.members.includes(node.id) ? 1 : 0.13;
      });
      fitStoryLayout(story);
      if (mode === 'composed') {
        camera.goalPosition = { ...storyView.position };
        camera.goalTarget = { ...storyView.target };
      }
      markLabelLayoutDirty();
      renderStory(story);
    }

    function recompose(node, historyAction = 'push') {
      if (node.form === 'story') {
        const story = storyById[node.storyId];
        if (selected === node.id && activeStoryId === story.id) setOverview(historyAction);
        else selectStory(story, historyAction);
        return;
      }
      if (selected === node.id) {
        if (activeStoryId) {
          if (historyAction === 'push') pushHistory(null, activeStoryId);
          const story = storyById[activeStoryId];
          selected = story.nodeId;
          renderStory(story);
        } else {
          setOverview(historyAction);
        }
        return;
      }

      if (reader.dataset.mode === 'index') indexScrollTop = reader.scrollTop;
      if (historyAction === 'push') pushHistory(node.id, activeStoryId);
      selected = node.id;
      nodes.forEach(other => { other.returning = false; });

      if (!activeStoryId) {
        const connected = [...focusAdjacency[node.id]];
        node.goal = { x: 0, y: 0, z: 560 };
        node.goalAlpha = 1;

        connected.forEach((id, index) => {
          const angle = -Math.PI * 0.72 + index * (Math.PI * 1.44 / Math.max(connected.length - 1, 1));
          byId[id].goal = {
            x: Math.cos(angle) * 320,
            y: Math.sin(angle) * 205,
            z: 610 + (index % 2) * 140
          };
          byId[id].goalAlpha = 0.95;
        });

        nodes.forEach((other, index) => {
          if (other.id === node.id || focusAdjacency[node.id].has(other.id)) return;
          const direction = index % 2 === 0 ? -1 : 1;
          other.goal = {
            x: direction * (560 + (index % 3) * 120),
            y: other.base.y * 1.45,
            z: 1120 + (index % 4) * 160
          };
          other.goalAlpha = 0.16;
        });

        if (mode === 'composed') {
          camera.goalPosition = { x: -120, y: 70, z: -580 };
          camera.goalTarget = { x: 0, y: 0, z: 610 };
        }
      }
      markLabelLayoutDirty();
      renderRecord(node);
    }

    function indexGroup(title, ids) {
      return `
        <section class="index-group">
          <h2>${title}</h2>
          ${ids.map(id => {
            const node = byId[id];
            return `
              <button class="index-row" data-node="${node.id}">
                <span class="index-row-title"><span>${node.label}</span><span>↗</span></span>
                <p>${node.kind}</p>
              </button>`;
          }).join('')}
        </section>`;
    }

    function renderIndex() {
      reader.dataset.mode = 'index';
      readerContent.innerHTML = `
        <h1 class="record-title">Index</h1>
        <p class="record-summary">Systems, products, and the work around them</p>
        <section class="index-stories">
          <h2>Stories</h2>
          ${stories.map(story => `
            <button class="index-story" data-story="${story.id}">
              <strong>${story.title}</strong>
              <p>${story.lede}</p>
            </button>`).join('')}
        </section>
        ${indexGroup('About', ['bradley'])}
        ${indexGroup('Operations', ['infamous', 'music-practice', 'systems-consulting'])}
        ${indexGroup('Campaign systems', ['kickoff', 'pitching', 'reporting'])}
        ${indexGroup('Personal system', ['personal-os'])}
        ${indexGroup('Client work', ['real-estate', 'touring'])}
        ${indexGroup('Products', ['dubs', 'writ', 'yoohoo', 'alarm'])}
      `;
      readerContent.querySelectorAll('[data-story]').forEach(button => {
        button.addEventListener('click', () => selectStory(storyById[button.dataset.story]));
      });
      readerContent.querySelectorAll('[data-node]').forEach(button => {
        button.addEventListener('click', () => recompose(byId[button.dataset.node]));
      });
      requestAnimationFrame(() => { reader.scrollTop = indexScrollTop; });
    }

    function renderStory(story) {
      reader.dataset.mode = 'story';
      readerContent.innerHTML = `
        <p class="record-kind story-kicker" data-story-kicker="${story.id}">Story</p>
        <h1 class="record-title">${story.title}</h1>
        <p class="record-summary">${story.lede}</p>
        <section class="record-section"><p>${story.body}</p></section>
        <section class="record-section">
          <h3>Explore this story</h3>
          ${story.members.map(id => {
            const node = byId[id];
            return `
              <button class="index-row" data-story-node="${node.id}">
                <span class="index-row-title"><span>${node.label}</span><span>↗</span></span>
                <p>${node.kind}</p>
              </button>`;
          }).join('')}
        </section>`;
      readerContent.querySelectorAll('[data-story-node]').forEach(button => {
        button.addEventListener('click', () => recompose(byId[button.dataset.storyNode]));
      });
      reader.scrollTo({ top: 0, behavior: 'auto' });
    }

    function renderRecord(node) {
      const story = storyById[activeStoryId];
      const aboutStories = node.id === 'bradley'
        ? `<section class="record-section">
            <h3>Stories</h3>
            ${stories.map(item => `
              <button class="index-row" data-about-story="${item.id}">
                <span class="index-row-title"><span>${item.title}</span><span>↗</span></span>
                <p>Editorial path</p>
              </button>`).join('')}
          </section>`
        : '';
      const related = [...adjacency[node.id]];
      reader.dataset.mode = 'record';
      readerContent.innerHTML = `
        ${story ? `<p class="reader-path"><button data-story-return>${story.title}</button> / ${node.label}</p>` : ''}
        <div class="record-kind">${node.kind}</div>
        <h1 class="record-title">${node.label}</h1>
        <p class="record-summary">${node.summary}</p>
        <section class="record-section">
          <h3>${node.sectionTitle}</h3>
          <p>${node.sectionBody}</p>
        </section>
        ${aboutStories}
        ${related.length ? `<section class="record-section">
          <h3>Related</h3>
          ${related.map(id => {
            const related = byId[id];
            return `
              <button class="index-row" data-related="${related.id}">
                <span class="index-row-title"><span>${related.label}</span><span>↗</span></span>
                <p>${related.kind}</p>
              </button>`;
          }).join('')}
        </section>` : ''}`;
      readerContent.querySelector('[data-story-return]')?.addEventListener('click', () => {
        if (selected) pushHistory(null, activeStoryId);
        selected = story.nodeId;
        renderStory(story);
      });
      readerContent.querySelectorAll('[data-related]').forEach(button => {
        button.addEventListener('click', () => recompose(byId[button.dataset.related]));
      });
      readerContent.querySelectorAll('[data-about-story]').forEach(button => {
        button.addEventListener('click', () => selectStory(storyById[button.dataset.aboutStory]));
      });
      reader.scrollTo({ top: 0, behavior: 'auto' });
    }

    function setMode(nextMode) {
      mode = nextMode;
      const roam = mode === 'roam';
      document.body.classList.toggle('roam', roam);
      composedButton.setAttribute('aria-pressed', String(!roam));
      roamButton.setAttribute('aria-pressed', String(roam));
      canvas.classList.toggle('can-drag', roam);

      if (roam) {
        const direction = normalise({
          x: camera.target.x - camera.position.x,
          y: camera.target.y - camera.position.y,
          z: camera.target.z - camera.position.z
        });
        camera.yaw = Math.atan2(direction.x, direction.z);
        camera.pitch = Math.asin(direction.y);
        updateRoamTarget();
      } else {
        if (selected || activeStoryId) {
          camera.goalPosition = { x: -120, y: 70, z: -580 };
          camera.goalTarget = { x: 0, y: 0, z: 610 };
        } else {
          camera.goalPosition = { ...overview.position };
          camera.goalTarget = { ...overview.target };
        }
      }
      markLabelLayoutDirty();
    }

    function updateRoamTarget() {
      const cp = Math.cos(camera.pitch);
      const direction = {
        x: Math.sin(camera.yaw) * cp,
        y: Math.sin(camera.pitch),
        z: Math.cos(camera.yaw) * cp
      };
      camera.target = {
        x: camera.position.x + direction.x * 1000,
        y: camera.position.y + direction.y * 1000,
        z: camera.position.z + direction.z * 1000
      };
    }

    function moveRoam(deltaSeconds) {
      if (mode !== 'roam') return;
      const b = basis();
      const speed = 340 * deltaSeconds;
      let dx = 0, dy = 0, dz = 0;
      if (keys.has('w') || keys.has('arrowup')) {
        dx += b.forward.x * speed; dy += b.forward.y * speed; dz += b.forward.z * speed;
      }
      if (keys.has('s') || keys.has('arrowdown')) {
        dx -= b.forward.x * speed; dy -= b.forward.y * speed; dz -= b.forward.z * speed;
      }
      if (keys.has('a') || keys.has('arrowleft')) {
        dx -= b.right.x * speed; dy -= b.right.y * speed; dz -= b.right.z * speed;
      }
      if (keys.has('d') || keys.has('arrowright')) {
        dx += b.right.x * speed; dy += b.right.y * speed; dz += b.right.z * speed;
      }
      if (keys.has('q')) dy -= speed;
      if (keys.has('e')) dy += speed;
      camera.position.x += dx;
      camera.position.y += dy;
      camera.position.z += dz;
      updateRoamTarget();
    }

    function easeWorld() {
      nodes.forEach(node => {
        if (!(dragging && dragNode === node)) {
          const returnRate = node.returning ? 0.018 : activeStoryId ? 0.075 : 0.055;
          node.x += (node.goal.x - node.x) * returnRate;
          node.y += (node.goal.y - node.y) * returnRate;
          node.z += (node.goal.z - node.z) * returnRate;
          if (node.returning && Math.hypot(node.goal.x - node.x, node.goal.y - node.y, node.goal.z - node.z) < 0.8) {
            node.returning = false;
          }
        }
        node.alpha += (node.goalAlpha - node.alpha) * 0.07;
      });
      if (mode === 'composed') {
        ['x', 'y', 'z'].forEach(axis => {
          camera.position[axis] += (camera.goalPosition[axis] - camera.position[axis]) * 0.045;
          camera.target[axis] += (camera.goalTarget[axis] - camera.target[axis]) * 0.045;
        });
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, width, height);
      const worldWidth = width - reader.getBoundingClientRect().width;
      ctx.fillStyle = colors.world;
      ctx.fillRect(0, 0, worldWidth, height);
      const gradient = ctx.createRadialGradient(worldWidth * 0.48, height * 0.46, 20, worldWidth * 0.48, height * 0.46, Math.max(worldWidth, height) * 0.78);
      gradient.addColorStop(0, colors.worldNear);
      gradient.addColorStop(0.64, colors.world);
      gradient.addColorStop(1, colors.world);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, worldWidth, height);

      ctx.strokeStyle = colors.grid;
      ctx.lineWidth = 1;
      for (let x = 0; x < worldWidth; x += 72) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += 72) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(worldWidth, y); ctx.stroke();
      }
    }

    function connectorVisualForType(type) {
      return {
        type,
        dash: [],
        arrowhead: false,
        color: colors.connection
      };
    }

    function visibleStoryLinks() {
      if (!connectionsVisible) return [];
      const visible = storyMembershipLinks.filter(([, , , storyId]) => storyId !== 'finding-myself-in-software');
      const selectedNode = byId[selected];
      if (!selectedNode || selectedNode.form === 'story') return visible;
      const findingLink = storyMembershipLinks.find(([a, b, , storyId]) =>
        storyId === 'finding-myself-in-software' && (a === selectedNode.id || b === selectedNode.id)
      );
      return findingLink ? [...visible, findingLink] : visible;
    }

    function visibleStoryRootLinks() {
      if (!selected) return [];
      const selectedNode = byId[selected];
      if (selectedNode?.id === 'bradley') return storyLinks;
      if (selectedNode?.form === 'story') {
        return storyLinks.filter(([a, b]) => a === selectedNode.id || b === selectedNode.id);
      }
      return [];
    }

    function connectionIsActive({ a, b, layer, storyId }) {
      if (!selected) return false;
      const selectedNode = byId[selected];
      if (!selectedNode) return false;
      if (selectedNode.id === 'bradley') return layer === 'story-root';
      if (selectedNode.form === 'story') {
        if (selectedNode.storyId === 'finding-myself-in-software') {
          return (layer === 'story-root' && (a.id === selected || b.id === selected)) || layer === 'factual';
        }
        return (layer === 'story-root' && (a.id === selected || b.id === selected))
          || (layer === 'story-constellation' && storyId === selectedNode.storyId);
      }
      return a.id === selected || b.id === selected;
    }

    function drawLinks() {
      renderedConnectionCount = 0;
      if (!connectionsVisible) return;

      const segments = [
        ...links.map(([a, b, type]) => ({ a: byId[a], b: byId[b], type, layer: 'factual' })),
        ...visibleStoryRootLinks().map(([a, b, type]) => ({ a: byId[a], b: byId[b], type, layer: 'story-root' })),
        ...visibleStoryLinks().map(([a, b, type, storyId]) => ({ a: byId[a], b: byId[b], type, storyId, layer: 'story-constellation' }))
      ];
      segments.sort((one, two) => ((two.a.screen?.depth || 0) + (two.b.screen?.depth || 0)) - ((one.a.screen?.depth || 0) + (one.b.screen?.depth || 0)));
      segments.forEach(({ a, b, type, storyId, layer }) => {
        if (!a.screen || !b.screen) return;
        const active = connectionIsActive({ a, b, layer, storyId });
        const strength = selected ? (active ? 0.78 : 0.025) : 0.25;
        const alpha = Math.min(a.alpha, b.alpha) * strength;
        const connector = connectorVisualForType(type);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = connector.color;
        ctx.lineWidth = active ? 1.1 : 0.54;
        const dx = b.screen.x - a.screen.x;
        const dy = b.screen.y - a.screen.y;
        const distance = Math.hypot(dx, dy) || 1;
        const ux = dx / distance;
        const uy = dy / distance;
        const startX = a.screen.x + ux * 12;
        const startY = a.screen.y + uy * 12;
        const endX = b.screen.x - ux * 15;
        const endY = b.screen.y - uy * 15;
        ctx.setLineDash(connector.dash);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
        renderedConnectionCount += 1;
        ctx.restore();
      });

    }

    function wrapLabelLines(label, maxWidth = 132) {
      if (ctx.measureText(label).width <= maxWidth || !label.includes(' ')) return [label];
      const words = label.split(' ');
      let best = [label];
      let bestWidth = Infinity;
      for (let index = 1; index < words.length; index += 1) {
        const candidate = [words.slice(0, index).join(' '), words.slice(index).join(' ')];
        const widest = Math.max(...candidate.map(line => ctx.measureText(line).width));
        if (widest < bestWidth) {
          best = candidate;
          bestWidth = widest;
        }
      }
      return best;
    }

    function layoutNodeLabels() {
      ctx.save();
      ctx.font = '400 12.5px "NHG control", "Helvetica Neue", Helvetica, Arial, sans-serif';
      nodes.forEach(node => {
        if (!node.screen) {
          node.labelBox = null;
          node.labelLines = [];
          return;
        }
        node.labelLines = wrapLabelLines(node.label);
        const labelWidth = Math.ceil(Math.max(...node.labelLines.map(line => ctx.measureText(line).width)));
        const lineHeight = 15;
        node.labelBox = {
          x: node.screen.x - labelWidth / 2,
          y: node.screen.y + 18,
          width: labelWidth,
          height: node.labelLines.length * lineHeight,
          lineHeight
        };
      });
      ctx.restore();
    }

    function visualForNode(node) {
      const family = familyByForm[node.form];
      const register = registerByFamily[family];
      const story = storyById[activeStoryId];
      const storyMember = Boolean(story?.members.includes(node.id));
      const isSelected = selected === node.id;
      const isStoryNode = node.form === 'story';
      const storyColor = node.id === 'story-finding-myself-in-software' ? colors.findingStory : colors.storyNode;

      return {
        family,
        register,
        isStoryNode,
        storyMember,
        selected: isSelected,
        glyphSize: 15,
        labelSize: 12.5,
        labelWeight: 400,
        glow: false,
        pulseProgress: 0,
        glyphColor: isStoryNode ? storyColor : colors[register],
        labelColor: colors.ink
      };
    }

    function drawNode(node) {
      const p = node.screen;
      if (!p) return;
      const visual = visualForNode(node);
      const size = visual.glyphSize;
      const alpha = node.alpha;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = alpha;

      ctx.fillStyle = visual.glyphColor;
      ctx.strokeStyle = visual.glyphColor;
      ctx.lineWidth = 1.45;
      ctx.lineJoin = 'round';

      if (visual.family === 'story') {
        ctx.strokeStyle = visual.glyphColor;
        ctx.lineWidth = 1.45;
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.49);
        ctx.lineTo(0, size * 0.49);
        ctx.moveTo(-size * 0.43, -size * 0.245);
        ctx.lineTo(size * 0.43, size * 0.245);
        ctx.moveTo(-size * 0.43, size * 0.245);
        ctx.lineTo(size * 0.43, -size * 0.245);
        ctx.stroke();
      } else if (visual.family === 'identity') {
        const brainGlyph = brainSymbolGlyph(visual.glyphColor);
        if (brainGlyph) ctx.drawImage(brainGlyph, -size * 0.49, -size * 0.49, size * 0.98, size * 0.98);
      } else if (visual.family === 'formative') {
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.49, 0, Math.PI * 2);
        ctx.stroke();
      } else if (visual.family === 'operation') {
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.28, 0, Math.PI * 2);
        ctx.stroke();
      } else if (visual.family === 'component') {
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.52);
        ctx.lineTo(size * 0.51, size * 0.42);
        ctx.lineTo(-size * 0.51, size * 0.42);
        ctx.closePath();
        ctx.stroke();
      } else if (visual.family === 'personal') {
        ctx.beginPath();
        ctx.rect(-size * 0.48, -size * 0.48, size * 0.96, size * 0.96);
        ctx.stroke();
      } else if (visual.family === 'engagement') {
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.54);
        ctx.lineTo(size * 0.54, 0);
        ctx.lineTo(0, size * 0.54);
        ctx.lineTo(-size * 0.54, 0);
        ctx.closePath();
        ctx.stroke();
      } else if (visual.family === 'product') {
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.49, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.14, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `${visual.labelWeight} ${visual.labelSize}px "NHG control", "Helvetica Neue", Helvetica, Arial, sans-serif`;
      ctx.fillStyle = visual.labelColor;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      const labelBox = node.labelBox;
      if (labelBox) node.labelLines.forEach((line, index) => {
        ctx.fillText(line, p.x, labelBox.y + labelBox.lineHeight * (index + 0.5));
      });
      ctx.restore();
    }

    function render() {
      drawBackground();
      nodes.forEach(node => { node.screen = project(node); });
      layoutNodeLabels();
      drawLinks();
      [...nodes]
        .sort((a, b) => (b.screen?.depth || 0) - (a.screen?.depth || 0))
        .forEach(drawNode);
    }

    function findNodeAt(x, y) {
      return [...nodes]
        .filter(node => node.screen)
        .sort((a, b) => a.screen.depth - b.screen.depth)
        .find(node => {
          const dx = node.screen.x - x;
          const dy = node.screen.y - y;
          return Math.hypot(dx, dy) < 25;
        }) || null;
    }

    let lastTime = performance.now();
    function frame(now) {
      const delta = Math.min(0.04, (now - lastTime) / 1000);
      lastTime = now;
      moveRoam(delta);
      easeWorld();
      render();
      requestAnimationFrame(frame);
    }

    const actionSelector = 'button, a, input, textarea, select, [role="button"], [role="link"]';

    window.addEventListener('pointermove', event => {
      cursorInstrument.style.left = event.clientX + 'px';
      cursorInstrument.style.top = event.clientY + 'px';
      document.body.classList.add('cursor-on');
      const target = event.target instanceof Element ? event.target : null;
      document.body.classList.toggle('cursor-action', Boolean(target?.closest(actionSelector)));
      updateCursorPalette(event, target);
    });

    window.addEventListener('pointerdown', () => {
      document.body.classList.add('cursor-held');
    }, { capture: true });

    const releaseCursor = () => document.body.classList.remove('cursor-held');
    window.addEventListener('pointerup', releaseCursor, { capture: true });
    window.addEventListener('pointercancel', releaseCursor, { capture: true });
    window.addEventListener('blur', () => {
      document.body.classList.remove('cursor-on', 'cursor-node', 'cursor-action', 'cursor-held');
    });

    canvas.addEventListener('pointerdown', event => {
      dragDistance = 0;
      downNode = findNodeAt(event.clientX, event.clientY);
      dragNode = downNode;
      if (!dragNode) {
        dragging = false;
        dragKind = 'blank';
        lastPointer = { x: event.clientX, y: event.clientY };
        return;
      }
      dragging = true;
      dragKind = 'node';
      dragNode.returning = false;
      lastPointer = { x: event.clientX, y: event.clientY };
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
      document.body.classList.add('cursor-held');
    });

    canvas.addEventListener('pointermove', event => {
      pointer = { x: event.clientX, y: event.clientY };

      if (!dragging && dragKind === 'blank') {
        dragDistance = Math.hypot(event.clientX - lastPointer.x, event.clientY - lastPointer.y);
      }

      if (dragging && mode === 'roam') {
        const dx = event.clientX - lastPointer.x;
        const dy = event.clientY - lastPointer.y;
        dragDistance += Math.abs(dx) + Math.abs(dy);
        camera.yaw += dx * 0.005;
        camera.pitch = Math.max(-1.25, Math.min(1.25, camera.pitch - dy * 0.004));
        updateRoamTarget();
        lastPointer = { x: event.clientX, y: event.clientY };
      } else if (dragging && mode === 'composed') {
        const dx = event.clientX - lastPointer.x;
        const dy = event.clientY - lastPointer.y;
        dragDistance += Math.abs(dx) + Math.abs(dy);

        if (dragKind === 'node' && dragNode && dragNode.screen) {
          const scale = Math.max(0.18, dragNode.screen.scale);
          const b = basis();
          const screenRight = dx / scale;
          const screenDown = dy / scale;
          const proposed = {
            x: dragNode.x + b.right.x * screenRight - b.up.x * screenDown,
            y: dragNode.y + b.right.y * screenRight - b.up.y * screenDown,
            z: dragNode.z + b.right.z * screenRight - b.up.z * screenDown
          };
          dragNode.x = proposed.x;
          dragNode.y = proposed.y;
          dragNode.z = proposed.z;
        }
        lastPointer = { x: event.clientX, y: event.clientY };
      }
      const hit = findNodeAt(event.clientX, event.clientY);
      hovered = hit ? hit.id : null;
      canvas.classList.toggle('over-node', Boolean(hit) && !dragging);
      document.body.classList.toggle('cursor-node', Boolean(hit) && !dragging);
    });

    canvas.addEventListener('pointerup', event => {
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      canvas.classList.remove('dragging');
      document.body.classList.remove('cursor-held');
      const wasClick = dragDistance < 8;
      const releasedNode = dragNode;
      dragging = false;
      if (wasClick && downNode) {
        recompose(downNode);
      }
      else if (wasClick && dragKind === 'blank' && (selected || activeStoryId)) setOverview();
      else if (releasedNode) {
        const droppedPosition = { x: releasedNode.x, y: releasedNode.y, z: releasedNode.z };
        releasedNode.goal = { ...droppedPosition };
        releasedNode.returning = false;
        if (!selected && !activeStoryId) {
          releasedNode.base = { ...droppedPosition };
          releasedNode.rawBase = { ...droppedPosition };
          releasedNode.userPlaced = true;
        }
      }
      dragKind = null;
      dragNode = null;
      downNode = null;
    });

    canvas.addEventListener('pointerenter', () => document.body.classList.add('cursor-on'));
    canvas.addEventListener('pointerleave', () => {
      if (!dragging) document.body.classList.remove('cursor-node');
    });

    canvas.addEventListener('wheel', event => {
      if (mode !== 'roam') return;
      event.preventDefault();
      const b = basis();
      const amount = Math.max(-120, Math.min(120, event.deltaY)) * 1.65;
      camera.position.x += b.forward.x * amount;
      camera.position.y += b.forward.y * amount;
      camera.position.z += b.forward.z * amount;
      updateRoamTarget();
    }, { passive: false });

    window.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if (['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright'].includes(key)) {
        keys.add(key);
        if (mode === 'roam') event.preventDefault();
      }
      if (event.key === 'Escape') setOverview();
    });

    window.addEventListener('keyup', event => keys.delete(event.key.toLowerCase()));
    window.addEventListener('popstate', event => {
      const nodeId = event.state && event.state.node;
      const storyId = event.state && event.state.story;
      if (storyId && storyById[storyId]) {
        const story = storyById[storyId];
        selectStory(story, 'none');
        if (nodeId && nodeId !== story.nodeId && byId[nodeId]) recompose(byId[nodeId], 'none');
      } else if (nodeId && byId[nodeId]) {
        recompose(byId[nodeId], 'none');
      } else {
        setOverview('none');
      }
      requestAnimationFrame(() => { reader.scrollTop = event.state && event.state.scroll ? event.state.scroll : 0; });
    });
    window.addEventListener('resize', resize);
    composedButton.addEventListener('click', () => setMode('composed'));
    roamButton.addEventListener('click', () => setMode('roam'));
    indexButton.addEventListener('click', () => setOverview());

    const conversationDock = document.getElementById('conversationDock');
    const assistantPanel = document.getElementById('assistant-panel');
    const assistantTrigger = document.getElementById('assistant-trigger');
    const assistantClose = document.getElementById('assistant-close');
    const assistantDragHandle = document.getElementById('assistant-drag-handle');
    const assistantComposer = document.getElementById('assistant-composer');
    const assistantAvatar = conversationDock.querySelector('.mini-avatar');
    let assistantPanelPosition = null;
    let assistantDrag = null;

    function clamp(value, minimum, maximum) {
      return Math.min(Math.max(value, minimum), Math.max(minimum, maximum));
    }

    function assistantIsMobile() {
      return window.matchMedia('(max-width: 900px)').matches;
    }

    function resetMobileAssistantDock() {
      conversationDock.style.left = '14px';
      conversationDock.style.top = 'auto';
      conversationDock.style.right = 'auto';
      conversationDock.style.bottom = '14px';
    }

    function avatarContribution() {
      const avatarStyle = getComputedStyle(assistantAvatar);
      return assistantAvatar.getBoundingClientRect().width + parseFloat(avatarStyle.marginRight || 0);
    }

    function placeAssistantPanel(left, top, panelWidth, panelHeight) {
      if (assistantIsMobile()) {
        resetMobileAssistantDock();
        return { x: left, y: top };
      }
      const readerBox = reader.getBoundingClientRect();
      const minimumLeft = avatarContribution() + 12;
      const x = clamp(left, minimumLeft, readerBox.left - panelWidth - 12);
      const y = clamp(top, 12, window.innerHeight - panelHeight - 12);
      conversationDock.style.left = `${x - avatarContribution()}px`;
      conversationDock.style.top = `${y}px`;
      conversationDock.style.right = 'auto';
      conversationDock.style.bottom = 'auto';
      return { x, y };
    }

    function rememberAssistantPosition() {
      const box = assistantPanel.getBoundingClientRect();
      if (!box.width || !box.height) return;
      assistantPanelPosition = { x: box.left, y: box.top, width: box.width, height: box.height };
    }

    function placeAssistantTriggerAtPanelCorner() {
      if (!assistantPanelPosition || assistantIsMobile()) {
        if (assistantIsMobile()) resetMobileAssistantDock();
        return;
      }
      const triggerSize = 40;
      const dockHeight = Math.max(assistantAvatar.getBoundingClientRect().height, triggerSize);
      const triggerLeft = assistantPanelPosition.x + assistantPanelPosition.width - triggerSize;
      const triggerTop = assistantPanelPosition.y + assistantPanelPosition.height - triggerSize;
      conversationDock.style.left = `${triggerLeft - avatarContribution()}px`;
      conversationDock.style.top = `${triggerTop - (dockHeight - triggerSize)}px`;
      conversationDock.style.right = 'auto';
      conversationDock.style.bottom = 'auto';
    }

    function setAssistantState(state) {
      if (state === 'closed' && document.body.dataset.assistant === 'open') rememberAssistantPosition();
      document.body.dataset.assistant = state;
      assistantTrigger.setAttribute('aria-expanded', String(state === 'open'));

      if (state === 'open') {
        if (assistantIsMobile()) {
          resetMobileAssistantDock();
        } else if (assistantPanelPosition) {
          const position = placeAssistantPanel(
            assistantPanelPosition.x,
            assistantPanelPosition.y,
            assistantPanelPosition.width,
            assistantPanelPosition.height
          );
          assistantPanelPosition = { ...assistantPanelPosition, ...position };
        } else {
          rememberAssistantPosition();
        }
      } else {
        placeAssistantTriggerAtPanelCorner();
      }
    }

    assistantDragHandle.addEventListener('pointerdown', event => {
      if (assistantIsMobile() || event.target.closest('button')) return;
      const box = assistantPanel.getBoundingClientRect();
      assistantDrag = {
        pointerId: event.pointerId,
        offsetX: event.clientX - box.left,
        offsetY: event.clientY - box.top
      };
      assistantDragHandle.setPointerCapture(event.pointerId);
    });

    assistantDragHandle.addEventListener('pointermove', event => {
      if (!assistantDrag || event.pointerId !== assistantDrag.pointerId) return;
      const box = assistantPanel.getBoundingClientRect();
      const position = placeAssistantPanel(
        event.clientX - assistantDrag.offsetX,
        event.clientY - assistantDrag.offsetY,
        box.width,
        box.height
      );
      assistantPanelPosition = { ...position, width: box.width, height: box.height };
    });

    function endAssistantDrag(event) {
      if (!assistantDrag || event.pointerId !== assistantDrag.pointerId) return;
      assistantDragHandle.releasePointerCapture(event.pointerId);
      assistantDrag = null;
      rememberAssistantPosition();
    }

    assistantDragHandle.addEventListener('pointerup', endAssistantDrag);
    assistantDragHandle.addEventListener('pointercancel', endAssistantDrag);
    assistantTrigger.addEventListener('click', () => setAssistantState('open'));
    assistantClose.addEventListener('click', () => setAssistantState('closed'));
    assistantComposer.addEventListener('submit', event => {
      event.preventDefault();
      conversationDock.classList.add('thinking');
      window.setTimeout(() => conversationDock.classList.remove('thinking'), 480);
    });

    window.addEventListener('resize', () => {
      if (assistantIsMobile()) {
        resetMobileAssistantDock();
        return;
      }
      if (!assistantPanelPosition) return;
      const position = placeAssistantPanel(
        assistantPanelPosition.x,
        assistantPanelPosition.y,
        assistantPanelPosition.width,
        assistantPanelPosition.height
      );
      assistantPanelPosition = { ...assistantPanelPosition, ...position };
      if (document.body.dataset.assistant === 'closed') placeAssistantTriggerAtPanelCorner();
    });

    window.__portfolioDebug = {
      snapshot() {
        const story = storyById[activeStoryId];
        return {
          selected,
          activeStoryId,
          storyMembers: story ? [...story.members] : [],
          storyConnectionMode: 'silverpoint-contextual',
          connectionsVisible,
          renderedConnectionCount,
          layoutModel,
          links: links.map(([a, b, type]) => ({ a, b, type })),
          storyLinks: storyLinks.map(([a, b, type]) => ({ a, b, type })),
          visibleStoryRootLinks: visibleStoryRootLinks().map(([a, b, type]) => ({ a, b, type })),
          visibleStoryLinks: visibleStoryLinks().map(([a, b, type]) => ({ a, b, type })),
          connectorVisuals: connectionsVisible
            ? ['direct', 'lineage', 'story'].map(connectorVisualForType).map(({ type, dash, arrowhead }) => ({ type, dash, arrowhead }))
            : [],
          worldWidth: width - reader.getBoundingClientRect().width,
          fov: camera.fov,
          nodes: nodes.map(node => ({
            id: node.id,
            form: node.form,
            tier: node.tier,
            x: node.x,
            y: node.y,
            z: node.z,
            goal: { ...node.goal },
            returning: node.returning,
            userPlaced: node.userPlaced,
            alpha: node.alpha,
            visual: visualForNode(node),
            labelBox: node.labelBox ? { ...node.labelBox } : null,
            labelLines: node.labelLines ? [...node.labelLines] : [],
            screen: node.screen ? { ...node.screen } : null
          }))
        };
      }
    };

    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
    const applySystemTheme = () => setTheme(systemTheme.matches ? 'dark' : 'light');
    applySystemTheme();
    systemTheme.addEventListener('change', applySystemTheme);
    const hashParts = location.hash.slice(1).split('/').filter(Boolean);
    const initialStory = hashParts[0] === 'story' ? storyById[hashParts[1]] : null;
    const initialNodeId = initialStory ? hashParts[2] : hashParts[0];
    const initialNode = byId[initialNodeId] || null;
    history.replaceState({
      node: initialNode ? initialNode.id : null,
      story: initialStory ? initialStory.id : null,
      scroll: 0,
      indexScrollTop: 0
    }, '', location.href);
    resize();
    setMode('composed');
    if (initialStory) {
      selectStory(initialStory, 'none');
      if (initialNode) recompose(initialNode, 'none');
    } else if (initialNode) {
      recompose(initialNode, 'none');
    } else {
      renderIndex();
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
