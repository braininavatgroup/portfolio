                      - generic [ref=f1e1135]: gallery · sequence · unknown
                - paragraph [ref=f1e1136]: Each product holds that standard somewhere different. Dubs is the fullest test, a thought captured mid-stride without breaking it. Writ passes by disappearing, audio that stays where you put it from a tool you never open. Yoohoo pushes the question past the desk and asks whether notifications can hold state without creating more noise.
