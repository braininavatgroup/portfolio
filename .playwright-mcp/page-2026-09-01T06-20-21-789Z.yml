                      - strong [ref=f1e1198]: Show the roughly thirty-minute, four-app administrative process collapsing into one guided sequence that still leaves commitment human.
                      - generic [ref=f1e1199]: gallery · comparison · capture
                - paragraph [ref=f1e1200]: The design argument is restraint. The automation assembles; it never commits. Every step is a prefilled dialog I can cancel, and the email stays a draft until I send it. Assets we already hold get attached on the way out, so clients never re-enter what we already have.
                - paragraph [ref=f1e1201]: "The same restraint runs the asset workflow, which replaced email threads where files got lost and re-versioned across a dozen messages. Every asset lives on our side rather than as a link into the client's storage, because client-hosted files change and permissions vanish mid-campaign. Speed is only half the payoff. The other half is service: nothing gets lost, nothing goes stale, and the campaign starts while the client is still excited."
