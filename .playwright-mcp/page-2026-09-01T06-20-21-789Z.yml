              - paragraph [ref=f1e1120]: Thread
              - paragraph [ref=f1e1121]: The best work tools do more than remove steps. They become responsive enough to practice on and, eventually, to stop noticing.
              - generic [ref=f1e1122]:
                - paragraph [ref=f1e1123]: A script on my machine watches the dictation engine's log so the confirming keystroke lands the instant the transcript finishes pasting. That is an unreasonable amount of engineering to save a quarter of a second, and it is the whole thesis. A tool you have to think about is a tool you are not thinking through.
                - paragraph [ref=f1e1124]: Fluency changes what a day is. When capture is instant and trusted, a stray idea stops being an interruption. When the frequent actions cost nothing, the right move and the easy move become the same move. Work stops being administration punctuated by thought and starts to reward repetition, the way an instrument does.
                - 'button "Open gallery visual in map: Reuse the strongest Personal OS, Dubs, Writ, and Yoohoo visuals as one sequence of tools becoming fluent enough to disappear." [ref=f1e1125]':
                  - figure "Planned gallery Reuse the strongest Personal OS, Dubs, Writ, and Yoohoo visuals as one sequence of tools becoming fluent enough to disappear. gallery · sequence · unknown" [ref=f1e1126]:
