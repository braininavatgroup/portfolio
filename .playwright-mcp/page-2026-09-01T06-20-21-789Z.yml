              - paragraph [ref=f1e1049]: A daily pipeline that finds wins, verifies the evidence, and drafts every client report.
              - generic [ref=f1e1050]:
                - paragraph [ref=f1e1051]: Reporting is where the practice proves itself, and it nearly drowned the practice instead. It once ate close to three days of every week, all of it spent collecting evidence of work already done and assembling it into spreadsheets, at the direct expense of the work itself.
                - paragraph [ref=f1e1052]: I invented the process, refined it by hand for years, and automated fragments with macros. The turning point was delegation. Handing it to an assistant with no background in music forced me to write down judgment I had been carrying in my head, and teaching turned into managing, improving the system from outside the weeds. Full automation is the same discipline with a faster executor. It needs a precise spec, written for someone with no context.
                - paragraph [ref=f1e1053]: That judgment now lives in a versioned rules document the model reads on every run, with commitments like silence is not a pass, never invent, and never downgrade an outcome. Code re-checks every conclusion the model draws. The one decision with consequences beyond the report, whether a curator becomes auto-pitchable, sits outside the model entirely in a small deterministic gate.
                - 'button "Open gallery visual in map: Trace the daily pipeline from source evidence through model judgment, deterministic verification, the auto-pitchable gate, dashboards, and drafted client reports." [ref=f1e1054]':
                  - figure "Planned gallery Trace the daily pipeline from source evidence through model judgment, deterministic verification, the auto-pitchable gate, dashboards, and drafted client reports. gallery · sequence · recreate" [ref=f1e1055]:
                    - generic [ref=f1e1060]: 1 / 3
                    - generic [ref=f1e1061]:
                      - generic [ref=f1e1062]: Planned gallery
                      - strong [ref=f1e1063]: Trace the daily pipeline from source evidence through model judgment, deterministic verification, the auto-pitchable gate, dashboards, and drafted client reports.
                      - generic [ref=f1e1064]: gallery · sequence · recreate
                - paragraph [ref=f1e1065]: Today the pipeline runs daily, dashboards refresh through the day, and client emails arrive as drafts for a personal pass. What was roughly sixteen hours of reporting per campaign, spread across eight report updates in the month after a release, now takes about an hour of my week in total, with fewer errors, not more.
