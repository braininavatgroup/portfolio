              - paragraph [ref=f1e1186]: The keyboard shortcut that turns a client’s “let’s do it” into the correct Airtable records, [Drive and Fillout details in progress], a live invoice, a folder, and a drafted kickoff email in under a minute.
              - generic [ref=f1e1187]:
                - paragraph [ref=f1e1188]: "Every campaign starts at the same dangerous moment. A signed confirmation means a client is ready to pay, and it is the worst possible time to disappear into administrative work. Kickoff compresses that work into one keyboard shortcut: client and deal records, the invoice, the campaign folder, and a drafted kickoff email carrying a payment link and one asset-request form per campaign. Roughly thirty minutes across four apps became about one, and invoicing stopped being a chase."
                - 'button "Open gallery visual in map: Show the roughly thirty-minute, four-app administrative process collapsing into one guided sequence that still leaves commitment human." [ref=f1e1189]':
                  - figure "Planned gallery Show the roughly thirty-minute, four-app administrative process collapsing into one guided sequence that still leaves commitment human. gallery · comparison · capture" [ref=f1e1190]:
